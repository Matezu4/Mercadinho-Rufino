<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Produtos - Mercadinho Rufino</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
         :root {
            --primary-color: #d76b7e;
            --secondary-color: #a3db59;
            --background-color: #fffbe6;
            --card-color: #d7f5d5;
            --text-dark: #2b4a2b;
            --text-light: white;
            --footer-color: #d88952;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background-color: var(--background-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            width: 100%;
            margin: 0;
            padding: 0;
        }
        
        body.menu-open {
            overflow: hidden;
        }
        /* Cabeçalho */
        
        header {
            background: linear-gradient(90deg, #e88290, #d76b7e);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
        }
        
        .logo-container {
            display: flex;
            align-items: center;
            flex: 1;
        }
        
        header img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
        }
        
        nav {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            transition: all 0.3s ease;
        }
        
        nav a {
            color: var(--text-light);
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
        }
        
        nav a:hover {
            color: #88481a;
        }
        /* Barra de busca */
        
        .search-box {
            background: white;
            border-radius: 25px;
            padding: 5px 15px;
            display: flex;
            align-items: center;
            width: 260px;
            box-shadow: 0px 3px 8px rgba(0, 0, 0, 0.1);
        }
        
        .search-box input {
            border: none;
            outline: none;
            padding: 8px;
            flex: 1;
            font-size: 14px;
        }
        
        .search-box i {
            font-size: 18px;
            color: #d88952;
            cursor: pointer;
        }
        /* Conteúdo principal */
        
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
            flex: 1;
        }
        
        .page-title {
            text-align: center;
            margin: 20px 0;
            color: var(--text-dark);
            font-size: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        
        .page-title i {
            font-size: 2rem;
            color: var(--primary-color);
        }
        
        .category-filter {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin: 20px 0;
        }
        
        .category-btn {
            background-color: var(--card-color);
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .category-btn:hover,
        .category-btn.active {
            background-color: var(--primary-color);
            color: white;
        }
        
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        
        .product-card {
            background-color: var(--card-color);
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.15);
        }
        
        .product-image {
            width: 100%;
            height: 180px;
            object-fit: contain;
            border-radius: 10px;
            margin-bottom: 10px;
            background-color: #f5f5f5;
        }
        
        .product-name {
            font-weight: 600;
            margin: 10px 0;
            color: var(--text-dark);
            font-size: 1.1rem;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .product-price {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary-color);
            margin: 10px 0;
        }
        
        .product-category {
            font-size: 0.9rem;
            color: #666;
            background-color: rgba(0, 0, 0, 0.05);
            padding: 3px 8px;
            border-radius: 10px;
            margin-top: auto;
        }
        /* Rodapé */
        
        footer {
            background-color: var(--footer-color);
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-top: auto;
            gap: 15px;
            width: 100%;
            max-width: 100%;
        }
        
        footer img {
            width: 100px;
            border-radius: 50%;
        }
        
        footer nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        footer nav a {
            margin: 0 8px;
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }
        
        footer nav a:hover {
            color: #88481a;
        }
        
        footer .socials {
            display: flex;
            gap: 12px;
        }
        
        footer .socials a {
            color: white;
            font-size: 20px;
            transition: 0.3s;
        }
        
        footer .socials a:hover {
            color: #333;
        }
        
        footer button {
            background: var(--card-color);
            padding: 8px 16px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            color: var(--text-dark);
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        footer button:hover {
            background: #c3e6c3;
        }
        /* Menu Mobile Lateral */
        
        .mobile-menu {
            position: fixed;
            top: 0;
            left: -250px;
            width: 250px;
            height: 100%;
            background: linear-gradient(180deg, #e88290, #d76b7e);
            z-index: 1000;
            transition: left 0.3s ease;
            padding: 20px;
            overflow-y: auto;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.2);
        }
        
        .mobile-menu.active {
            left: 0;
        }
        
        .mobile-menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .mobile-menu-header img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
        }
        
        .close-menu {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }
        
        .mobile-nav {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .mobile-nav a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .mobile-nav a:hover {
            color: #88481a;
        }
        
        .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }
        
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
            display: none;
        }
        
        .overlay.active {
            display: block;
        }
        /* Barra de pesquisa no header */
        
        .header-search {
            display: none;
            flex: 1;
            max-width: 250px;
            margin-top: 60px;
            margin-left: 2px;
        }
        
        .header-search input {
            font-size: 14px;
            padding: 6px 8px;
        }
        /* Mostrar no mobile */
        
        @media (max-width: 768px) {
            .header-search {
                display: flex;
                align-items: center;
            }
            header {
                display: flex;
                align-items: center;
                justify-content: space-between;
            }
            .menu-toggle {
                margin-right: 10px;
            }
        }
        
        @media (max-width: 768px) {
            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            }
            .page-title {
                font-size: 2rem;
            }
            nav {
                flex-direction: column;
                width: 100%;
                margin-top: 10px;
            }
            footer {
                flex-direction: column;
                text-align: center;
            }
        }
        
        @media (max-width: 480px) {
            .products-grid {
                grid-template-columns: 1fr;
            }
            .page-title {
                font-size: 1.8rem;
            }
            header img {
                display: none;
            }
            .menu-toggle {
                display: block;
            }
            nav:not(.mobile-nav) {
                display: none;
            }
            .search-box {
                width: 100%;
                margin-top: 10px;
                order: 3;
            }
        }
    </style>
</head>

<script>
    // Sistema de Pesquisa Completo
    function setupSearch() {
        const searchInputs = document.querySelectorAll('.search-box input');
        const searchIcons = document.querySelectorAll('.search-box i');
        
        // Processar parâmetros da URL ao carregar a página
        processURLParameters();

        // Função de busca
        function performSearch(searchTerm) {
            if (!searchTerm.trim()) {
                // Se a busca estiver vazia, mostra todos os produtos da categoria atual
                const activeCategory = document.querySelector('.category-btn.active').getAttribute('data-category');
                renderProducts(activeCategory);
                
                // Limpar parâmetro da URL se busca estiver vazia
                const newUrl = window.location.pathname;
                window.history.replaceState({}, '', newUrl);
                return;
            }

            const term = searchTerm.toLowerCase().trim();
            
            // Atualizar URL com o termo de busca
            const newUrl = `${window.location.pathname}?search=${encodeURIComponent(searchTerm)}`;
            window.history.replaceState({}, '', newUrl);
            
            const filteredProducts = productsData.filter(product => {
                // Busca por nome do produto
                const nameMatch = product.name.toLowerCase().includes(term);
                
                // Busca por categoria
                const categoryMatch = categories[product.category].title.toLowerCase().includes(term);
                
                // Busca por palavras-chave relacionadas
                const keywords = getProductKeywords(product);
                const keywordMatch = keywords.some(keyword => keyword.includes(term));
                
                return nameMatch || categoryMatch || keywordMatch;
            });

            // Ordenar resultados por relevância
            const sortedResults = sortByRelevance(filteredProducts, term);
            
            displaySearchResults(sortedResults, term);
        }

        // Função para processar parâmetros de URL
        function processURLParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const searchTerm = urlParams.get('search');
            
            if (searchTerm) {
                // Preencher o campo de busca
                const searchInputs = document.querySelectorAll('.search-box input');
                searchInputs.forEach(input => {
                    input.value = decodeURIComponent(searchTerm);
                });
                
                // Executar a busca automaticamente
                setTimeout(() => {
                    performSearch(searchTerm);
                }, 100);
            }
        }

        // Palavras-chave para cada produto
        function getProductKeywords(product) {
            const keywords = {
                'frios': ['queijo', 'presunto', 'linguiça', 'salsicha', 'hambúrguer', 'calabresa', 'carne', 'frango'],
                'higiene': ['sabão', 'detergente', 'limpeza', 'limpar', 'lavar', 'desinfetante', 'amaciante', 'sabonete'],
                'bebidas': ['refrigerante', 'suco', 'água', 'café', 'leite', 'cerveja', 'vinho', 'pinga'],
                'alimentos': ['arroz', 'feijão', 'açúcar', 'farinha', 'óleo', 'macarrão', 'extrato', 'maionese'],
                'doces': ['doce', 'sobremesa', 'chocolate', 'bala', 'brigadeiro', 'gelatina', 'bolo', 'biscoito'],
                'utilidades': ['papel', 'saco', 'vassoura', 'rodo', 'pilha', 'lâmpada', 'isqueiro', 'fósforo']
            };

            const productKeywords = keywords[product.category] || [];
            
            // Adicionar palavras do nome do produto
            const nameWords = product.name.toLowerCase().split(' ');
            return [...new Set([...productKeywords, ...nameWords])];
        }

        // Ordenar por relevância
        function sortByRelevance(products, searchTerm) {
            return products.sort((a, b) => {
                const aName = a.name.toLowerCase();
                const bName = b.name.toLowerCase();
                
                // Pontuação baseada na posição da busca no nome
                const aScore = calculateRelevanceScore(aName, searchTerm);
                const bScore = calculateRelevanceScore(bName, searchTerm);
                
                return bScore - aScore;
            });
        }

        function calculateRelevanceScore(productName, searchTerm) {
            let score = 0;
            
            // Match exato no início
            if (productName.startsWith(searchTerm)) {
                score += 10;
            }
            
            // Match exato em qualquer posição
            if (productName.includes(searchTerm)) {
                score += 5;
            }
            
            // Match de palavras individuais
            const searchWords = searchTerm.split(' ');
            const productWords = productName.split(' ');
            
            searchWords.forEach(word => {
                if (productWords.some(pw => pw.startsWith(word))) {
                    score += 3;
                }
                if (productWords.includes(word)) {
                    score += 2;
                }
            });
            
            return score;
        }

        // Exibir resultados da busca
        function displaySearchResults(results, searchTerm) {
            const productsContainer = document.getElementById('products-container');
            const categoryTitle = document.getElementById('category-title');
            
            productsContainer.innerHTML = '';
            
            if (results.length === 0) {
                productsContainer.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 40px;">
                        <i class="bi bi-search" style="font-size: 3rem; color: #ccc; margin-bottom: 15px;"></i>
                        <h3 style="color: #666; margin-bottom: 10px;">Nenhum produto encontrado</h3>
                        <p style="color: #888;">Não encontramos resultados para "${searchTerm}"</p>
                        <button onclick="clearSearch()" style="margin-top: 15px; padding: 10px 20px; background: var(--primary-color); color: white; border: none; border-radius: 20px; cursor: pointer;">
                            <i class="bi bi-arrow-left"></i> Ver todos os produtos
                        </button>
                    </div>
                `;
                categoryTitle.innerHTML = `<i class="bi bi-search"></i> Resultados para "${searchTerm}"`;
                return;
            }

            categoryTitle.innerHTML = `<i class="bi bi-search"></i> ${results.length} resultado(s) para "${searchTerm}"`;

            results.forEach(product => {
                const productCard = document.createElement('div');
                productCard.className = 'product-card';
                productCard.innerHTML = `
                    <img src="${product.image}" alt="${product.name}" class="product-image" onerror="this.src='https://via.placeholder.com/250x180/eee/ccc?text=Imagem+Não+Disponível'">
                    <div class="product-name">${highlightSearchTerm(product.name, searchTerm)}</div>
                    <div class="product-price">${product.price}</div>
                    <div class="product-category">${categories[product.category].title}</div>
                `;
                productsContainer.appendChild(productCard);
            });
        }

        // Destacar termo buscado
        function highlightSearchTerm(text, searchTerm) {
            if (!searchTerm) return text;
            
            const regex = new RegExp(`(${searchTerm})`, 'gi');
            return text.replace(regex, '<mark style="background-color: #ffeb3b; padding: 2px 0;">$1</mark>');
        }

        // Event listeners para os inputs de busca
        searchInputs.forEach(input => {
            // Busca ao digitar (com debounce)
            let timeout;
            input.addEventListener('input', function() {
                clearTimeout(timeout);
                timeout = setTimeout(() => {
                    performSearch(this.value);
                }, 500);
            });

            // Busca ao pressionar Enter
            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    performSearch(this.value);
                }
            });
        });

        // Busca ao clicar no ícone de pesquisa
        searchIcons.forEach(icon => {
            icon.addEventListener('click', function() {
                const searchInput = this.previousElementSibling;
                performSearch(searchInput.value);
            });
        });
    }

    // Função global para limpar busca
    window.clearSearch = function() {
        const searchInputs = document.querySelectorAll('.search-box input');
        searchInputs.forEach(input => input.value = '');
        
        // Limpar URL
        const newUrl = window.location.pathname;
        window.history.replaceState({}, '', newUrl);
        
        const activeCategory = document.querySelector('.category-btn.active').getAttribute('data-category');
        renderProducts(activeCategory);
    };

    // Sistema de Pesquisa Global para outras páginas
    function setupGlobalSearch() {
        const searchInputs = document.querySelectorAll('.search-box input');
        const searchIcons = document.querySelectorAll('.search-box i');
        
        // Função para executar a busca e redirecionar
        function performGlobalSearch(searchTerm) {
            if (!searchTerm.trim()) {
                return; // Não faz nada se estiver vazio
            }
            
            // Codificar o termo de busca para URL
            const encodedTerm = encodeURIComponent(searchTerm.trim());
            
            // Redirecionar para produtos.html com o parâmetro de busca
            window.location.href = `produtos.html?search=${encodedTerm}`;
        }
        
        // Event listeners para todos os inputs de busca
        searchInputs.forEach(input => {
            // Busca ao pressionar Enter
            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    performGlobalSearch(this.value);
                }
            });
        });
        
        // Event listeners para ícones de busca
        searchIcons.forEach(icon => {
            icon.addEventListener('click', function() {
                const searchInput = this.previousElementSibling;
                performGlobalSearch(searchInput.value);
            });
        });
    }

    // Inicializar sistema apropriado baseado na página
    document.addEventListener('DOMContentLoaded', function() {
        if (window.location.pathname.includes('produtos.html')) {
            // Inicializar sistema de busca na página de produtos
            setupSearch();
            
            // Adicionar estilo CSS para a busca
            const style = document.createElement('style');
            style.textContent = `
                .search-box {
                    position: relative;
                }
                
                .search-box:focus-within {
                    box-shadow: 0px 3px 12px rgba(215, 107, 126, 0.3);
                }
                
                mark {
                    background-color: #ffeb3b !important;
                    color: inherit;
                    font-weight: bold;
                }
                
                @media (max-width: 768px) {
                    .search-box {
                        margin: 10px 0;
                    }
                }
            `;
            document.head.appendChild(style);
        } else {
            // Inicializar sistema de busca global para outras páginas
            setupGlobalSearch();
        }
    });
</script>

        const categoryButtons = document.querySelectorAll('.category-btn');

        // Função para renderizar produtos
        function renderProducts(category = 'all') {
            // Limpar container
            productsContainer.innerHTML = '';

            // Filtrar produtos por categoria
            const filteredProducts = category === 'all' ?
                productsData :
                productsData.filter(product => product.category === category);

            // Atualizar título
            categoryTitle.innerHTML = `<i class="${categories[category].icon}"></i> ${categories[category].title}`;

            // Renderizar produtos
            if (filteredProducts.length === 0) {
                productsContainer.innerHTML = '<p style="grid-column: 1 / -1; text-align: center; padding: 40px;">Nenhum produto encontrado nesta categoria.</p>';
                return;
            }

            filteredProducts.forEach(product => {
                const productCard = document.createElement('div');
                productCard.className = 'product-card';
                productCard.innerHTML = `
                    <img src="${product.image}" alt="${product.name}" class="product-image" onerror="this.src='https://via.placeholder.com/250x180/eee/ccc?text=Imagem+Não+Disponível'">
                    <div class="product-name">${product.name}</div>
                    <div class="product-price">${product.price}</div>
                    <div class="product-category">${categories[product.category].title}</div>
                `;
                productsContainer.appendChild(productCard);
            });
        }

        // Adicionar event listeners aos botões de categoria
        categoryButtons.forEach(button => {
            button.addEventListener('click', function() {
                // Remover classe active de todos os botões
                categoryButtons.forEach(btn => btn.classList.remove('active'));

                // Adicionar classe active ao botão clicado
                this.classList.add('active');

                // Renderizar produtos da categoria selecionada
                const category = this.getAttribute('data-category');
                renderProducts(category);
            });
        });

        // Inicializar a página com todos os produtos
        renderProducts();
